<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Admin UI for windblog_quarkus">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="windblog_admin_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>windblog_admin_flutter</title>
  <link rel="manifest" href="manifest.json">
    <script>
        window._windblogSavePicker = function (blobUrl, fileName) {
            if (!window.showSaveFilePicker) {
                var a = document.createElement('a');
                a.href = blobUrl;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                return;
            }
            fetch(blobUrl)
                .then(function (r) {
                    return r.blob();
                })
                .then(function (blob) {
                    return window.showSaveFilePicker({
                        suggestedName: fileName,
                        types: [{description: 'ZIP Archive', accept: {'application/zip': ['.zip']}}]
                    }).then(function (handle) {
                        return handle.createWritable().then(function (writable) {
                            return writable.write(blob).then(function () {
                                return writable.close();
                            });
                        });
                    });
                })
                .catch(function (e) {
                    if (e.name !== 'AbortError') {
                        var a = document.createElement('a');
                        a.href = blobUrl;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    }
                });
        };
    </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
